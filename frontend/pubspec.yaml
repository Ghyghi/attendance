name: tracker
description: School attendance mobile app (student/teacher/admin) — Flutter client.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Networking ---
  dio: ^5.7.0

  # --- State management ---
  flutter_riverpod: ^2.6.1

  # --- Routing ---
  go_router: ^14.6.2

  # --- Secure token storage ---
  flutter_secure_storage: ^9.2.2

  # --- Camera capture (selfie, camera-only source) ---
  image_picker: ^1.1.2

  # --- Location (GPS submission) ---
  geolocator: ^13.0.2

  # --- Value equality for models (avoids handwritten == / hashCode) ---
  equatable: ^2.0.7

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true